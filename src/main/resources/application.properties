# Application Name
spring.application.name=myPortfolio-1

# --- SERVER PORT CONFIGURATION ---
# Render ke dynamic port ko pakadne ke liye ye sabse zaroori hai
server.port=${PORT:8080}

# --- ONLINE DATABASE CONFIGURATION (Clever Cloud) ---
# Render ke environment variables (DB_URL, DB_USERNAME, DB_PASSWORD) se match kiya gaya hai

# Database connection limit ko 5 se niche set karna
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1

spring.datasource.url=jdbc:mysql://localhost:3306/portfolio
spring.datasource.username=root
spring.datasource.password=golu@111


#spring.datasource.url=${DB_URL}
#spring.datasource.username=${DB_USERNAME}
#spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# --- JPA / Hibernate Settings ---
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
# MySQL 8 Dialect jo Clever Cloud ke liye best hai
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# --- Thymeleaf Settings ---
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false

# --- File Upload Configuration ---
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=1MB