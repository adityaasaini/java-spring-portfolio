<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Catalog | Admin Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    
    <style>
        body { 
            background-color: #f4f7f6; 
            padding: 40px 0; 
            font-family: 'Quicksand', sans-serif; 
        }
        .section-title {
            color: #004d40;
            font-weight: 800;
            margin-bottom: 40px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .service-card { 
            background: white; 
            border-radius: 20px; 
            overflow: hidden; 
            border: none; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.05); 
            height: 100%; 
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
        }
        .service-card:hover { 
            transform: translateY(-10px); 
            box-shadow: 0 15px 30px rgba(0,0,0,0.1); 
        }
        .service-img { 
            width: 100%; 
            height: 200px; 
            object-fit: cover; 
            border-bottom: 3px solid #00b894;
        }
        .card-body {
            padding: 25px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }
        .card-title {
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 15px;
        }
        .card-text {
            color: #7f8c8d;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        .btn-action {
            border-radius: 50px;
            font-weight: 600;
            padding: 8px 20px;
            transition: 0.3s;
        }
        .btn-update {
            background-color: #00b894;
            color: white;
            border: none;
        }
        .btn-update:hover {
            background-color: #004d40;
            color: white;
            transform: scale(1.05);
        }
        .btn-delete {
            border: 2px solid #ff7675;
            color: #ff7675;
        }
        .btn-delete:hover {
            background-color: #ff7675;
            color: white;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-5">
        <h2 class="section-title mb-0">🛠️ Active Services</h2>
        <a th:href="@{/admin/home}" class="btn btn-outline-dark rounded-pill px-4">
            <i class="fa fa-arrow-left"></i> Back to Home
        </a>
    </div>

    <div class="row">
        <div class="col-lg-4 col-md-6 mb-4" th:each="service : ${listOfServices}">
            <div class="service-card">
                <img th:src="@{'/img/services/' + ${service.filename}}" class="service-img" alt="Service Image">
                
                <div class="card-body">
                    <h4 class="card-title" th:text="${service.title}">Service Title</h4>
                    <p class="card-text" th:text="${service.description}">Service description goes here.</p>
                    
                    <div class="mt-auto d-flex justify-content-between">
                        <a th:href="@{/admin/updateService(id=${service.id})}" class="btn btn-action btn-update btn-sm">
                            <i class="fa fa-edit"></i> Update
                        </a>
                        
                        <a th:href="@{/admin/deleteService(id=${service.id}, filename=${service.filename})}" 
                           class="btn btn-action btn-delete btn-sm"
                           onclick="return confirm('Are you sure you want to delete this service?');">
                            <i class="fa fa-trash"></i> Delete
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-12 text-center py-5" th:if="${#lists.isEmpty(listOfServices)}">
            <h4 class="text-muted">No services found. Start by adding one!</h4>
            <a th:href="@{/admin/addService}" class="btn btn-success mt-3 rounded-pill">Add New Service</a>
        </div>
    </div>
</div>

<script th:src="@{/js/jquery-3.2.1.min.js}"></script>
<script th:src="@{/js/bootstrap.min.js}"></script>
</body>
</html>
