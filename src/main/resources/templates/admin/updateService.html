<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Service | Admin Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    
    <style>
        body { background-color: #f4f7f6; font-family: 'Quicksand', sans-serif; }
        .update-container { margin-top: 80px; margin-bottom: 80px; }
        .form-card { 
            background: #fff; 
            border-radius: 25px; 
            padding: 40px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.1); 
            border: none; 
        }
        .section-title { 
            color: #004d40; 
            font-weight: 800; 
            margin-bottom: 30px; 
            text-align: center;
        }
        .form-label { font-weight: 700; color: #34495e; margin-bottom: 8px; }
        .form-control { 
            border-radius: 12px; 
            padding: 12px 15px; 
            border: 2px solid #e0f2f1; 
            transition: 0.3s;
        }
        .form-control:focus { 
            border-color: #00b894; 
            box-shadow: 0 0 10px rgba(0, 184, 148, 0.1); 
        }
        .file-input-wrapper {
            background: #e0f2f1;
            padding: 20px;
            border-radius: 15px;
            border: 2px dashed #00b894;
            text-align: center;
        }
        .btn-update { 
            background: #00b894; 
            color: white; 
            border-radius: 50px; 
            padding: 12px 40px; 
            font-weight: 800; 
            border: none; 
            width: 100%; 
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn-update:hover { 
            background: #004d40; 
            transform: scale(1.02); 
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .back-link { color: #7f8c8d; transition: 0.3s; text-decoration: none; font-weight: 600; }
        .back-link:hover { color: #00b894; }
    </style>
</head>
<body>

    <div th:replace="~{header :: header}"></div>

    <div class="container update-container">
        <div class="row justify-content-center">
            <div class="col-lg-6 col-md-8">
                
                <div class="form-card">
                    <h2 class="section-title">✏️ Update Service</h2>
                    
                    <form th:action="@{/admin/updateService}" method="post" enctype="multipart/form-data">
                        
                        <input type="hidden" name="id" th:value="${serviceData.id}"/>
                        <input type="hidden" name="oldFilename" th:value="${serviceData.filename}"/>
                        
                        <div class="form-group mb-4">
                            <label class="form-label">Service Title</label>
                            <input type="text" name="title" class="form-control" th:value="${serviceData.title}" placeholder="Enter title"/>
                        </div>
                        
                        <div class="form-group mb-4">
                            <label class="form-label">Description</label>
                            <textarea name="description" class="form-control" rows="5" th:text="${serviceData.description}" placeholder="Update service details..."></textarea>
                        </div>
                        
                        <div class="form-group mb-4">
                            <label class="form-label">Update Image (Optional)</label>
                            <div class="file-input-wrapper">
                                <input type="file" name="servicefile" class="form-control-file w-100"/>
                                <small class="text-muted d-block mt-2">
                                    <i class="fa fa-info-circle"></i> Leave empty to keep the current image
                                </small>
                            </div>
                        </div>
                        
                        <div class="mt-5">
                            <button type="submit" class="btn-update">
                                <i class="fa fa-refresh"></i> Save Changes
                            </button>
                        </div>

                        <div class="text-center mt-4">
                            <a th:href="@{/admin/readAllServices}" class="back-link">
                                <i class="fa fa-arrow-left"></i> Cancel and Go Back
                            </a>
                        </div>
                    </form>
                </div>

            </div>
        </div>
    </div>

    <div th:replace="~{footer :: footer}"></div>

    <script th:src="@{/js/jquery-3.2.1.min.js}"></script>
    <script th:src="@{/js/bootstrap.min.js}"></script>
</body>
</html>
