<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Resume | Admin Center</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    
    <style>
        body { background-color: #f4f7f6; font-family: 'Quicksand', sans-serif; }
        .upload-container { margin-top: 100px; margin-bottom: 100px; }
        .upload-card { 
            background: #fff; 
            border-radius: 25px; 
            padding: 50px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.1); 
            border: none; 
            text-align: center;
        }
        .icon-box {
            width: 80px;
            height: 80px;
            background: #e0f2f1;
            color: #00b894;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 35px;
            margin: 0 auto 25px;
        }
        .status-msg { 
            font-weight: 700; 
            color: #00b894; 
            margin-bottom: 20px; 
            padding: 10px;
            border-radius: 10px;
            background: #f0fff4;
        }
        .file-drop-area {
            position: relative;
            display: flex;
            align-items: center;
            width: 100%;
            max-width: 100%;
            padding: 30px;
            border: 2px dashed #00b894;
            border-radius: 15px;
            background-color: #f9fbfb;
            transition: 0.3s;
            cursor: pointer;
            margin-bottom: 30px;
        }
        .file-drop-area:hover { background-color: #e0f2f1; }
        .btn-upload { 
            background: #00b894; 
            color: white; 
            border-radius: 50px; 
            padding: 12px 50px; 
            font-weight: 800; 
            border: none; 
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(0, 184, 148, 0.3);
        }
        .btn-upload:hover { 
            background: #004d40; 
            transform: translateY(-3px); 
            box-shadow: 0 6px 20px rgba(0, 184, 148, 0.4);
        }
        .back-link { 
            color: #7f8c8d; 
            text-decoration: none; 
            font-weight: 600; 
            display: inline-block;
            margin-top: 30px;
            transition: 0.3s;
        }
        .back-link:hover { color: #00b894; }
    </style>
</head>
<body>

    <div th:replace="~{header :: header}"></div>

    <div class="container upload-container">
        <div class="row justify-content-center">
            <div class="col-lg-5 col-md-7">
                
                <div class="upload-card">
                    <div class="icon-box">
                        <i class="fa fa-file-pdf-o"></i>
                    </div>

                    <h2 style="color: #004d40; font-weight: 800; margin-bottom: 10px;">Resume Center</h2>
                    <p class="text-muted mb-4">Upload your latest professional CV</p>

                    <div th:if="${result}" class="status-msg">
                        <i class="fa fa-check-circle"></i> <span th:text="${result}"></span>
                    </div>

                    <form th:action="@{/admin/uploadResume}" method="post" enctype="multipart/form-data">
                        <div class="file-drop-area">
                            <input type="file" name="resume" class="form-control-file" style="opacity: 1; cursor: pointer;" required>
                        </div>
                        
                        <button type="submit" class="btn-upload w-100">
                            <i class="fa fa-cloud-upload"></i> Upload Now
                        </button>
                    </form>

                    <a th:href="@{/admin/home}" class="back-link">
                        <i class="fa fa-long-arrow-left"></i> Return to Dashboard
                    </a>
                </div>

            </div>
        </div>
    </div>

    <div th:replace="~{footer :: footer}"></div>

    <script th:src="@{/js/jquery-3.2.1.min.js}"></script>
    <script th:src="@{/js/bootstrap.min.js}"></script>
</body>
</html>
