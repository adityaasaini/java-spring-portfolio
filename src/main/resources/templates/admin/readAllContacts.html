<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Client Inquiries | Admin</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <style>
        body { background: #f4f7f6; padding: 40px 0; }
        .contact-card { background: white; border-radius: 15px; border: none; margin-bottom: 20px; transition: 0.3s; border-left: 5px solid #00b894; }
        .contact-card:hover { box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
        .meta-data { font-size: 0.85rem; color: #7f8c8d; }
    </style>
</head>
<body>
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-5">
        <h2 style="color: #004d40; font-weight: 800;">📩 Client Messages</h2>
        <a th:href="@{/admin/home}" class="btn btn-outline-dark btn-sm rounded-pill">Admin Home</a>
    </div>

    <div th:each="contact : ${contactData}" class="card contact-card p-4">
        <div class="row align-items-center">
            <div class="col-md-9">
                <h5 class="mb-1" th:text="${contact.name}" style="font-weight: 700; color: #2c3e50;"></h5>
                <p class="text-primary mb-2" th:text="${contact.subject}" style="font-weight: 600;"></p>
                <p class="mb-3 text-muted" th:text="${contact.message}"></p>
                <div class="meta-data">
                    <i class="fa fa-clock-o"></i> <span th:text="${contact.datetime}"></span>
                </div>
            </div>
            <div class="col-md-3 text-right">
                <a th:href="@{/admin/deleteContactById(id=${contact.id})}" class="btn btn-danger btn-sm rounded-pill px-4">
                    <i class="fa fa-trash"></i> Delete
                </a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
