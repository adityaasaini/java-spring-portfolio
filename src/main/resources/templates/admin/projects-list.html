<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Manage Projects | Admin</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <style>
        body { background-color: #f4f7f6; padding: 40px 0; font-family: 'Quicksand', sans-serif; }
        .admin-container { background: #fff; border-radius: 15px; padding: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    </style>
</head>
<body>

<div class="container">
    <div th:if="${session.msg}" class="alert alert-success alert-dismissible fade show text-center">
        <strong th:text="${session.msg}"></strong>
        <button type="button" class="close" data-dismiss="alert">&times;</button>
        <th:block th:text="${#session.removeAttribute('msg')}"></th:block>
    </div>

    <div class="admin-container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 style="color: #004d40; font-weight: 800;">💼 Manage Projects</h2>
            <a th:href="@{/admin/add-project}" class="btn btn-success" style="border-radius: 50px;">+ Add New</a>
        </div>

        <table class="table table-hover text-center align-middle">
            <thead class="thead-dark">
                <tr>
                    <th>Image</th>
                    <th>Title</th>
                    <th>Tech</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="p : ${projects}">
                    <td><img th:src="@{'/img/projects/' + ${p.imageFileName}}" width="80" height="50" style="object-fit:cover; border-radius:5px;"></td>
                    <td th:text="${p.title}" class="font-weight-bold"></td>
                    <td th:text="${p.techStack}"></td>
                    <td>
                        <a th:href="@{'/admin/delete-project/' + ${p.id}}" 
                           class="btn btn-sm btn-danger" 
                           onclick="return confirm('Pakka delete karna hai?')">Delete</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(projects)}">
                    <td colspan="4">No projects found.</td>
                </tr>
            </tbody>
        </table>
    </div>
    <div class="text-center mt-4">
        <a th:href="@{/admin/home}" class="btn btn-secondary" style="border-radius: 50px;">Back to Dashboard</a>
    </div>
</div>

<script th:src="@{/js/jquery-3.2.1.min.js}"></script>
<script th:src="@{/js/bootstrap.min.js}"></script>
</body>
</html>
