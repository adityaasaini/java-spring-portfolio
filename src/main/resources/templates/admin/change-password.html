<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password | Admin Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card-password { 
            margin-top: 80px; 
            border-radius: 20px; 
            border: none; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
        }
        .header-icon {
            width: 70px; height: 70px;
            background: #e0f2f1; color: #00b894;
            border-radius: 50%; display: flex;
            align-items: center; justify-content: center;
            font-size: 30px; margin: -35px auto 20px;
            border: 5px solid #f8f9fa;
        }
        .form-control { border-radius: 10px; padding: 12px; border: 1px solid #dee2e6; }
        .btn-update { 
            background: #00b894; color: white; border: none;
            padding: 12px; border-radius: 10px; font-weight: 700;
            transition: 0.3s;
        }
        .btn-update:hover { background: #00897b; transform: translateY(-2px); }
        .alert { border-radius: 15px; font-weight: 600; border: none; }
    </style>
</head>
<body>

    <div th:replace="~{header :: header}"></div>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card card-password px-4 pb-4">
                    <div class="header-icon shadow-sm">
                        <i class="fa fa-lock"></i>
                    </div>
                    
                    <h3 class="text-center mb-1" style="color: #2c3e50; font-weight: 800;">Security Center</h3>
                    <p class="text-center text-muted mb-4 small">Admin password update karein</p>

                    <div th:if="${msg}" th:classappend="${msgClass}" class="alert alert-dismissible fade show text-center" role="alert">
                        <span th:text="${msg}"></span>
                    </div>

                    <form th:action="@{/admin/update-password}" method="post">
                        <div class="mb-3">
                            <label class="form-label small font-weight-bold">Current Password</label>
                            <input type="password" name="oldPass" class="form-control" placeholder="Old password enter karein" required>
                        </div>

                        <div class="mb-4">
                            <label class="form-label small font-weight-bold">New Password</label>
                            <input type="password" name="newPass" class="form-control" placeholder="Naya password set karein" required>
                        </div>

                        <button type="submit" class="btn-update w-100 shadow-sm">
                            <i class="fa fa-refresh"></i> Update Now
                        </button>
                    </form>

                    <div class="text-center mt-4">
                        <a th:href="@{/admin/home}" class="text-muted small" style="text-decoration: none;">
                            <i class="fa fa-arrow-left"></i> Back to Dashboard
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{footer :: footer}"></div>

</body>
</html>
