<header class="header_area" th:fragment="header" style="position: fixed; top: 20px; left: 0; right: 0; z-index: 9999; display: flex; justify-content: center; pointer-events: none;">
    
    <style>
        /* === HOVER EFFECTS FIX === */
        .custom-nav .nav-link-custom {
            padding: 5px 10px !important;
            color: #ffffff !important;
            font-weight: 600;
            font-size: 14px;
            transition: color 0.3s ease;
        }
        
        /* Cursor le jane par text teal color ka ho jayega */
        .custom-nav .nav-link-custom:hover {
            color: #00b894 !important;
        }

        /* Contact Button Hover Effect */
        .contact-btn {
            background: #ffffff !important;
            color: #000000 !important;
            font-weight: 700;
            font-size: 13px;
            padding: 8px 22px !important;
            border-radius: 30px;
            transition: all 0.3s ease !important;
            display: inline-block;
            text-decoration: none !important;
        }
        .contact-btn:hover {
            background-color: #00b894 !important;
            color: #ffffff !important;
            transform: scale(1.05);
        }

        /* === PC View Settings (992px and above) === */
        @media (min-width: 992px) {
            .custom-nav {
                border-radius: 50px !important;
                padding: 10px 25px !important;
            }
            .navbar-collapse.collapse {
                display: flex !important;
                height: auto !important;
                visibility: visible !important;
            }
            .navbar-nav {
                flex-direction: row !important;
                gap: 20px;
            }
            .nav-item {
                margin: 0 !important;
            }
        }

        /* === Mobile View Settings (Below 992px) === */
        @media (max-width: 991.98px) {
            .custom-nav {
                border-radius: 25px !important;
                padding: 10px 20px !important;
            }
            .navbar-collapse {
                background: rgba(15, 15, 15, 0.95);
                border-radius: 20px;
                margin-top: 15px;
                padding: 20px;
                backdrop-filter: blur(15px);
                border: 1px solid rgba(255, 255, 255, 0.1);
                /* Added for smooth manual toggle */
                display: none; 
                transition: all 0.3s ease;
                
                /* === STRICT MOBILE SCROLL FIX === */
                max-height: 80vh;
                overflow-y: auto;
            }
            .navbar-collapse.show-menu {
                display: block !important;
                animation: fadeIn 0.3s ease-in-out;
            }
            .navbar-nav {
                flex-direction: column !important;
                gap: 15px;
            }
            .navbar-toggler {
                margin-left: auto;
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>

    <div style="pointer-events: auto; width: 100%; max-width: 950px; padding: 0 15px;">
        <nav class="navbar navbar-expand-lg custom-nav" style="background: rgba(15, 15, 15, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 100%; transition: all 0.3s ease;">
            
            <a class="navbar-brand" th:href="@{/client/home}" style="text-decoration: none; margin-right: 0;">
                <span style="color: #ffffff; font-weight: 800; font-size: 22px; letter-spacing: 0.5px; font-family: 'Quicksand', sans-serif;">
                    Aditya<span style="color: #00b894;">.</span>
                </span>
            </a>
            
            <button class="navbar-toggler custom-toggler" type="button" aria-label="Toggle navigation" style="border: none; outline: none; padding: 5px; cursor: pointer;">
                <span style="background-color: #ffffff; display: block; width: 22px; height: 2px; margin-bottom: 5px; border-radius: 2px;"></span>
                <span style="background-color: #ffffff; display: block; width: 22px; height: 2px; margin-bottom: 5px; border-radius: 2px;"></span>
                <span style="background-color: #ffffff; display: block; width: 22px; height: 2px; border-radius: 2px;"></span>
            </button>
            
            <div class="navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav ml-auto text-center align-items-center" style="list-style: none; padding: 0; margin: 0;">
                    
                    <li class="nav-item"><a class="nav-link nav-link-custom" th:href="@{/client/home}">Home</a></li>
                    <li class="nav-item"><a class="nav-link nav-link-custom" th:href="@{/client/about}">About</a></li>
<li class="nav-item"><a class="nav-link nav-link-custom" th:href="@{/client/projects}">Projects</a></li>
                    
                    <li class="nav-item">
                        <a class="nav-link nav-link-custom" th:href="@{/admin/downloadResume}" style="display: flex; align-items: center; justify-content: center; gap: 5px;">
                            Resume <i class="fa fa-download" style="font-size: 11px;"></i>
                        </a>
                    </li>
                    
                    <li class="nav-item ml-lg-3 mt-3 mt-lg-0">
                        <a class="contact-btn" th:href="@{/client/contact}">Contact</a>                         
                    </li>
                </ul>
            </div>
        </nav>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const toggler = document.querySelector('.custom-toggler');
            const menu = document.getElementById('navbarSupportedContent');

            if(toggler && menu) {
                toggler.addEventListener('click', function(e) {
                    e.preventDefault();
                    // Toggle custom class directly to avoid Bootstrap clash
                    if(menu.classList.contains('show-menu')) {
                        menu.classList.remove('show-menu');
                    } else {
                        menu.classList.add('show-menu');
                    }
                });
            }
        });
    </script>
</header>
